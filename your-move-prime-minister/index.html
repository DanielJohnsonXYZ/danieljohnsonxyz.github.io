<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061326" />
  <title>Your Move, Prime Minister</title>
  <style>
    html,body{margin:0;min-height:100%;background:#061326;color:#f5e8ca;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.loading{text-align:center;padding:24px}.crest{font-size:34px;color:#d7ad53}.name{font-family:Georgia,serif;font-weight:700;letter-spacing:.04em;margin-top:8px}.status{font-size:12px;color:#9aaabd;margin-top:8px}.error{max-width:420px;line-height:1.5}
  </style>
</head>
<body>
  <div class="loading"><div class="crest">♛</div><div class="name">YOUR MOVE, PRIME MINISTER</div><div class="status">Opening the red box…</div></div>
  <script>
    (async()=>{
      const owner='DanielJohnsonXYZ',repo='git_test',ref='your-move-prime-minister';
      const cssFiles=['styles.css','shell.css','education-ui.css'];
      const jsFiles=['events.js','events-1.js','events-2.js','events-3.js','events-4.js','events-5.js','education.js','app.js','shell.js'];
      const files=['index.html',...cssFiles,...jsFiles];
      const url=file=>`https://api.github.com/repos/${owner}/${repo}/contents/${file}?ref=${encodeURIComponent(ref)}`;
      const decode=b64=>{const binary=atob(b64.replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0)));};
      try{
        const entries=await Promise.all(files.map(async file=>{const r=await fetch(url(file),{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(`${file} failed (${r.status})`);const data=await r.json();return[file,decode(data.content)];}));
        const source=Object.fromEntries(entries);
        let html=source['index.html'];
        cssFiles.forEach(file=>{html=html.replace(`<link rel="stylesheet" href="${file}" />`,`<style>\n${source[file]}\n</style>`);});
        const oldScripts=jsFiles.map(file=>`<script src="${file}"><`+`/script>`).join('');
        const newScripts=jsFiles.map(file=>`<script>\n${source[file].replace(/<\/script/gi,'<\\/script')}\n<`+`/script>`).join('');
        if(!html.includes(oldScripts))throw new Error('game script bundle did not match');
        html=html.replace(oldScripts,newScripts);
        document.open();document.write(html);document.close();
      }catch(error){
        console.error(error);
        document.querySelector('.loading').innerHTML=`<div class="crest">♛</div><div class="name">YOUR MOVE, PRIME MINISTER</div><p class="status error">The game could not load: ${error.message}. Refresh once to try again.</p>`;
      }
    })();
  <\/script>
</body>
</html>
