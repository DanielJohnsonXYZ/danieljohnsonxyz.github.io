<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061326" />
  <title>Your Move, Prime Minister</title>
  <style>
    html,body{margin:0;min-height:100%;background:#061326;color:#f5e8ca;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.loading{text-align:center;padding:24px}.crest{font-size:34px;color:#d7ad53}.name{font-family:Georgia,serif;font-weight:700;letter-spacing:.04em;margin-top:8px}.status{font-size:12px;color:#9aaabd;margin-top:8px}.error{max-width:420px;line-height:1.5}
  </style>
</head>
<body>
  <div class="loading"><div class="crest">♛</div><div class="name">YOUR MOVE, PRIME MINISTER</div><div class="status" id="loadStatus">Opening the red box…</div></div>
  <script>
    (async()=>{
      const owner='DanielJohnsonXYZ', repo='git_test', ref='your-move-prime-minister';
      const files=['index.html','styles.css','shell.css','education-ui.css','events.js','events-1.js','events-2.js','events-3.js','events-4.js','events-5.js','education.js','app.js','shell.js'];
      const apiPath=(file)=>`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(file)}?ref=${encodeURIComponent(ref)}`;
      const decode=(b64)=>{
        const binary=atob(b64.replace(/\n/g,''));
        const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
        return new TextDecoder('utf-8').decode(bytes);
      };
      try{
        const responses=await Promise.all(files.map(async file=>{
          const r=await fetch(apiPath(file),{headers:{Accept:'application/vnd.github+json'}});
          if(!r.ok) throw new Error(`${file} failed (${r.status})`);
          const data=await r.json();
          return [file,decode(data.content)];
        }));
        const map=Object.fromEntries(responses);
        let html=map['index.html'];
        html=html
          .replace('<link rel="stylesheet" href="styles.css" />',`<style>${map['styles.css']}</style>`)
          .replace('<link rel="stylesheet" href="shell.css" />',`<style>${map['shell.css']}</style>`)
          .replace('<link rel="stylesheet" href="education-ui.css" />',`<style>${map['education-ui.css']}</style>`);
        const scripts=['events.js','events-1.js','events-2.js','events-3.js','events-4.js','events-5.js','education.js','app.js','shell.js'];
        const scriptBlock=scripts.map(f=>`<script>\n${map[f].replace(/<\\/script/gi,'<\\\\/script')}\n<\\/script>`).join('');
        html=html.replace(/<script src="events\.js"><\\/script><script src="events-1\.js"><\\/script><script src="events-2\.js"><\\/script><script src="events-3\.js"><\\/script><script src="events-4\.js"><\\/script><script src="events-5\.js"><\\/script><script src="education\.js"><\\/script><script src="app\.js"><\\/script><script src="shell\.js"><\\/script>/,scriptBlock);
        document.open(); document.write(html); document.close();
      }catch(error){
        document.querySelector('.loading').innerHTML=`<div class="crest">♛</div><div class="name">YOUR MOVE, PRIME MINISTER</div><p class="status error">The game could not load: ${error.message}. Refresh once, and if it persists the deployment needs fixing.</p>`;
        console.error(error);
      }
    })();
  <\/script>
</body>
</html>
