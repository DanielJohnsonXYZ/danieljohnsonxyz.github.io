<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061326" />
  <title>Your Move, Prime Minister</title>
  <style>
    html,body{margin:0;min-height:100%;background:#061326;color:#f5e8ca;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.loading{text-align:center;padding:24px}.crest{font-size:34px;color:#d7ad53}.name{font-family:Georgia,serif;font-weight:700;letter-spacing:.04em;margin-top:8px}.status{font-size:12px;color:#9aaabd;margin-top:8px}
  </style>
</head>
<body>
  <div class="loading"><div class="crest">♛</div><div class="name">YOUR MOVE, PRIME MINISTER</div><div class="status">Opening the red box…</div></div>
  <script>
    (async()=>{
      const api='https://api.github.com/repos/DanielJohnsonXYZ/git_test/contents/index.html?ref=your-move-prime-minister';
      const assetBase='https://cdn.jsdelivr.net/gh/DanielJohnsonXYZ/git_test@your-move-prime-minister/';
      try{
        const response=await fetch(api,{headers:{'Accept':'application/vnd.github+json'}});
        if(!response.ok) throw new Error('Could not load game');
        const data=await response.json();
        const html=decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
        const withBase=html.replace('<head>','<head><base href="'+assetBase+'">');
        document.open();document.write(withBase);document.close();
      }catch(error){
        document.querySelector('.status').textContent='The game could not load. Refresh to try again.';
      }
    })();
  </script>
</body>
</html>
