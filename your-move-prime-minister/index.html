<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061326" />
  <title>Your Move, Prime Minister</title>
  <style>
    html,body{margin:0;min-height:100%;background:#061326;color:#f5e8ca;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.loading{text-align:center;padding:24px}.crest{font-size:34px;color:#d7ad53}.name{font-family:Georgia,serif;font-weight:700;letter-spacing:.04em;margin-top:8px}.status{font-size:12px;color:#9aaabd;margin-top:8px}
  </style>
</head>
<body>
  <div class="loading"><div class="crest">♛</div><div class="name">YOUR MOVE, PRIME MINISTER</div><div class="status">Opening Downing Street…</div></div>
  <script>
    (async()=>{
      const commit='9f090c4a5b779d80845b79055235804143cbb539';
      const base=`https://cdn.jsdelivr.net/gh/DanielJohnsonXYZ/git_test@${commit}/`;
      try{
        const response=await fetch(base+'index.html',{cache:'no-store'});
        if(!response.ok) throw new Error('Could not load game');
        let html=await response.text();
        html=html.replace('<head>','<head><base href="'+base+'">');
        document.open();document.write(html);document.close();
      }catch(error){
        document.querySelector('.status').textContent='The game could not load. Refresh once to try again.';
      }
    })();
  </script>
</body>
</html>
